<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <button data-choice="rock">Rock</button>
    <button data-choice="paper">Paper</button>
    <button data-choice="scissors">Scissors</button>
    <div id="results"></div>
    <div id="human-score">Your score: 0</div>
    <div id="computer-score">Computer score: 0</div>

    <script>
         let humanScore = 0;
         let computerScore = 0;
         const WinningScore = 5;
         const result = document.querySelector("#results");
         const humanScoreDisplay = document.querySelector("#human-score");
         const computerScoreDisplay = document.querySelector("#computer-score");
         const buttons = document.querySelectorAll("button");
         buttons.forEach((button) => {
         button.addEventListener("click", ()=>{
            playRound(button.dataset.choice , getComputerChoice());
         });
         });

        function getComputerChoice(){
           let Random_number =  Math.floor(Math.random() * 3);
           if (Random_number == 0){
            const Computerchoice = "rock";
            return Computerchoice;
           }
           else if (Random_number == 1){
           const Computerchoice = "paper";
            return Computerchoice;
           }
           else{
            const Computerchoice = "scissors";
            return Computerchoice;
           }

        }

        function resetIfGameOver() { 
        if (humanScore == WinningScore || computerScore == WinningScore ) {
        humanScore = 0;
        computerScore = 0;
         }};

        function updateScoreDisplay() {
        humanScoreDisplay.textContent = "Your score: " + humanScore;
        computerScoreDisplay.textContent = "Computer score: " + computerScore;
         };

        function checkGameWinner() {
        if (humanScore === WinningScore) {
        result.textContent="You win the game!";
        } 
        else if (computerScore === WinningScore) {
        result.textContent="Computer wins the game!";
        }};

      function playRound(playerSelection, computerChoice) {
        resetIfGameOver();

        if (playerSelection == computerChoice){
            result.textContent = "Same! Draw.";
        }
        else if (playerSelection =="rock" && computerChoice=="scissors"){
            result.textContent = "You win! Rock beat scissors.";
            humanScore += 1;
        }
        else if (playerSelection=="rock" && computerChoice=="paper"){
            result.textContent = "You lose! Paper beat rock.";
            computerScore += 1;
        }
        else if ( playerSelection == "paper" && computerChoice=="rock"){
            result.textContent ="You win! Paper beat rock.";
            humanScore += 1;
        }
        else if (playerSelection == "paper" && computerChoice=="scissors"){
            result.textContent = "You lose! Scissors beat paper.";
            computerScore += 1;
        }
        else if (playerSelection =="scissors" && computerChoice=="paper"){
            result.textContent = "You win! Scissors beat paper.";
            humanScore += 1;
        }
        else if (playerSelection=="scissors" && computerChoice=="rock"){
            result.textContent ="You lose! Rock beat scissors.";
            computerScore += 1;
        }

       updateScoreDisplay();
       checkGameWinner();
      }
    </script>
</body>
</html>
